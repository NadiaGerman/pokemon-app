---
- name: Install Docker and Python3 packages
  yum:
    name:
      - docker
      - python3
      - python3-pip
    state: present

- name: Install boto3 Python package explicitly with pip3
  pip:
    name: boto3
    executable: /usr/bin/pip3
    state: present

- name: Start and enable Docker
  systemd:
    name: docker
    state: started
    enabled: yes

- name: Add ec2-user to docker group
  user:
    name: ec2-user
    groups: docker
    append: yes
